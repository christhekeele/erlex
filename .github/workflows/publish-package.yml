name: Publish ❯ Package

on:
  # push:
  #   tags:
  #     - "v*"

  workflow_dispatch: {}

concurrency:
  group: perform-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testing Matrix
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: test

    continue-on-error: ${{ matrix.type == 'optional' }}
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - "ubuntu-22.04"
          - "windows-2022"
          - "macOS-15"
          - "macOS-14"
        elixir:
          - "1.18.x"
        otp:
          - "27.x"
          - "26.x"
          - "25.x"
        type: [required]
        exclude:
          - os: "macOS-15"
            otp: "24.x"
          - os: "macOS-14"
            otp: "24.x"
        include:
          # Elixir 1.17 (OTP 25-27)
          - elixir: "1.17.x"
            otp: "27.x"
            os: "ubuntu-24.04"
            type: required
          - elixir: "1.17.x"
            otp: "26.x"
            os: "ubuntu-22.04"
            type: required
          - elixir: "1.17.x"
            otp: "25.x"
            os: "windows-2022"
            type: required

          # Elixir 1.16 (OTP 24-26)
          - elixir: "1.16.x"
            otp: "26.x"
            os: "ubuntu-24.04"
            type: required
          - elixir: "1.16.x"
            otp: "25.x"
            os: "ubuntu-22.04"
            type: required
          - elixir: "1.16.x"
            otp: "24.x"
            os: "windows-2022"
            type: required

          # Elixir 1.15 (OTP 24-26)
          - elixir: "1.15.x"
            otp: "26.x"
            os: "ubuntu-24.04"
            type: required
          - elixir: "1.15.x"
            otp: "25.x"
            os: "ubuntu-22.04"
            type: required
          - elixir: "1.15.x"
            otp: "24.x"
            os: "windows-2022"
            type: required

          # Elixir 1.14 (OTP 23-26) - OTP 23 only on windows
          - elixir: "1.14.x"
            otp: "26.x"
            os: "ubuntu-24.04"
            type: required
          - elixir: "1.14.x"
            otp: "25.x"
            os: "ubuntu-22.04"
            type: required
          - elixir: "1.14.x"
            otp: "24.x"
            os: "windows-2022"
            type: required
          - elixir: "1.14.x"
            otp: "23.x"
            os: "windows-2022"
            type: required

          # Elixir 1.13 (OTP 22-25) - OTP 22-23 only on windows, macOS needs 25
          - elixir: "1.13.x"
            otp: "25.x"
            os: "ubuntu-22.04"
            type: required
          - elixir: "1.13.x"
            otp: "25.x"
            os: "macOS-14"
            type: required
          - elixir: "1.13.x"
            otp: "24.x"
            os: "windows-2022"
            type: required
          - elixir: "1.13.x"
            otp: "23.x"
            os: "windows-2022"
            type: required

          # Elixir 1.12 (OTP 22-24) - only windows for OTP 23-24
          - elixir: "1.12.x"
            otp: "24.x"
            os: "windows-2022"
            type: required
          - elixir: "1.12.x"
            otp: "23.x"
            os: "windows-2022"
            type: required

          # Elixir 1.11 (OTP 22-24) - only windows for OTP 23/24 (OTP 21 unavailable, 22 crashes)
          - elixir: "1.11.x"
            otp: "24.x"
            os: "windows-2022"
            type: required
          - elixir: "1.11.x"
            otp: "23.x"
            os: "windows-2022"
            type: required

          # Elixir 1.10 (OTP 21-23) - only windows for OTP 23 (OTP 21 unavailable, 22 crashes)
          - elixir: "1.10.x"
            otp: "23.x"
            os: "windows-2022"
            type: required

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        id: beam-versions
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-rebar: ${{ runner.os != 'Windows' }}

      - name: Restore mix dependency installation cache
        id: mix-deps-get-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            mix.lock
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-${{ steps.beam-versions.outputs.otp-version }}-${{ steps.beam-versions.outputs.elixir-version }}-mix-deps-get-mix-exs-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.exs')) }}

      - name: Install mix dependencies
        if: steps.mix-deps-get-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Restore mix dependency compilation cache
        id: mix-deps-compile-cache
        uses: actions/cache@v4
        with:
          path: _build
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-otp-${{ steps.beam-versions.outputs.otp-version }}-elixir-${{ steps.beam-versions.outputs.elixir-version }}-env-${{ env.MIX_ENV }}-mix-deps-compile-mix-lock-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - name: Compile mix dependencies
        if: steps.mix-deps-compile-cache.outputs.cache-hit != 'true'
        run: mix deps.compile

      - name: Run test suite
        run: mix test

  types:
    name: Typechecking Matrix
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: test

    continue-on-error: ${{ matrix.type == 'optional' }}
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - "ubuntu-22.04"
          - "windows-2022"
          - "macOS-15"
          - "macOS-14"
        elixir:
          - "1.18.x"
        otp:
          - "27.x"
          - "26.x"
          - "25.x"
        type: [required]
        exclude:
          - os: "macOS-15"
            otp: "24.x"
          - os: "macOS-14"
            otp: "24.x"

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        id: beam-versions
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-rebar: ${{ runner.os != 'Windows' }}

      - name: Restore mix dependency installation cache
        id: mix-deps-get-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            mix.lock
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-otp-${{ steps.beam-versions.outputs.otp-version }}-elixir-${{ steps.beam-versions.outputs.elixir-version }}-env-${{ env.MIX_ENV }}-mix-deps-get-mix-exs-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.exs')) }}

      - name: Install mix dependencies
        if: steps.mix-deps-get-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Restore mix dependency compilation cache
        id: mix-deps-compile-cache
        uses: actions/cache@v4
        with:
          path: _build
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-otp-${{ steps.beam-versions.outputs.otp-version }}-elixir-${{ steps.beam-versions.outputs.elixir-version }}-env-${{ env.MIX_ENV }}-mix-deps-compile-mix-lock-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - name: Compile mix dependencies
        if: steps.mix-deps-compile-cache.outputs.cache-hit != 'true'
        run: mix deps.compile

      - name: Restore mix typecheck cache
        id: mix-typecheck-cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-otp-${{ steps.beam-versions.outputs.otp-version }}-elixir-${{ steps.beam-versions.outputs.elixir-version }}-env-${{ env.MIX_ENV }}-mix-typecheck

      - name: Setup typechecking
        if: steps.mix-typecheck-cache.outputs.cache-hit != 'true'
        run: mix typecheck.build-cache

      - name: Run typecheck tasks
        run: mix typecheck

  lints:
    name: Linting
    runs-on: ${{ vars.PREFERRED_OS }}
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        id: beam-versions
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ vars.PREFERRED_ELIXIR }}
          otp-version: ${{ vars.PREFERRED_OTP }}
          install-rebar: ${{ runner.os != 'Windows' }}

      - name: Restore mix dependency installation cache
        id: mix-deps-get-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-otp-${{ steps.beam-versions.outputs.otp-version }}-elixir-${{ steps.beam-versions.outputs.elixir-version }}-env-${{ env.MIX_ENV }}-mix-deps-get-mix-lock-file-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - name: Install mix dependencies
        if: steps.mix-deps-get-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Restore mix dependency compilation cache
        id: mix-deps-compile-cache
        uses: actions/cache@v4
        with:
          path: _build
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-otp-${{ steps.beam-versions.outputs.otp-version }}-elixir-${{ steps.beam-versions.outputs.elixir-version }}-env-${{ env.MIX_ENV }}-mix-deps-compile-mix-lock-file-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - name: Compile mix dependencies
        if: steps.mix-deps-compile-cache.outputs.cache-hit != 'true'
        run: mix deps.compile

      - name: Run linter tasks
        run: mix lint

  hex:
    runs-on: ${{ vars.PREFERRED_OS }}
    name: Publishing to hex.pm

    needs:
      - tests
      - types
      - lints

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: prod

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        id: beam-versions
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ vars.PREFERRED_ELIXIR }}
          otp-version: ${{ vars.PREFERRED_OTP }}
          install-rebar: ${{ runner.os != 'Windows' }}

      - name: Restore mix dependency installation cache
        id: mix-deps-get-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-otp-${{ steps.beam-versions.outputs.otp-version }}-elixir-${{ steps.beam-versions.outputs.elixir-version }}-env-${{ env.MIX_ENV }}-mix-deps-get-mix-lock-file-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - name: Install mix dependencies
        if: steps.mix-deps-get-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Restore mix dependency compilation cache
        id: mix-deps-compile-cache
        uses: actions/cache@v4
        with:
          path: _build
          key: cache-${{ vars.CACHE_VERSION }}-os-${{ runner.os }}-otp-${{ steps.beam-versions.outputs.otp-version }}-elixir-${{ steps.beam-versions.outputs.elixir-version }}-env-${{ env.MIX_ENV }}-mix-deps-compile-mix-lock-file-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - name: Compile mix dependencies
        if: steps.mix-deps-compile-cache.outputs.cache-hit != 'true'
        run: mix deps.compile

      - name: Publish package to hex.pm
        run: mix hex.publish --yes

  results:
    name: Publish Package Results
    runs-on: ${{ vars.PREFERRED_OS }}

    if: ${{ always() }}
    needs:
      - tests
      - types
      - lints
      - hex

    steps:
      - name: Publish Package Succeeded
        if: ${{ needs.tests.result == 'success' && (needs.types.result == 'success' || needs.types.result == 'skipped') && needs.lints.result == 'success' && needs.hex.result == 'success' }}
        run: exit 0

      - name: Publish Package Failed
        if: ${{ needs.tests.result == 'failure' || needs.types.result == 'failure' || needs.lints.result == 'failure' || needs.hex.result == 'failure' }}
        run: exit 1
