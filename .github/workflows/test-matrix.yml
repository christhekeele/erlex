name: Test ❯ Matrix
# Runs tests and typechecking against the full battalion
# of supported OS, Erlang/OTP, and Elixir versions.

on:
  # Allow running from GitHub UI.
  workflow_dispatch: {}

  # Run on all pull requests to important branches.
  pull_request_target:
    branches:
      - latest
      - release

  # Run on all pushes to important branches.
  push:
    branches:
      - latest
      - release

env:
  MIX_ENV: test

concurrency:
  group: test-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testing Matrix
    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.type == 'optional' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-24.04"
          - "ubuntu-22.04"
          # - "ubuntu-20.04" # Retired
          - "windows-2025"
          - "windows-2022"
          - "macOS-15"
          - "macOS-14"
          # - "macOS-13" # Retired
        elixir:
          - "1.19.x"
        otp:
          - "28.x"
          - "27.x"
          - "26.x"
        type: [required]
        exclude:
          # Windows has problems with OTP 22.x from erlef/setup-beam
          # See: https://github.com/christhekeele/erlex/actions/runs/25879178544/job/76054530611
          - otp: "22.x"
            os: "windows-2022"
          - otp: "22.x"
            os: "windows-2025"
        include:
          ####
          # Older versions we want to check
          # See Elixir versions: https://github.com/elixir-lang/elixir/blob/main/lib/elixir/pages/references/compatibility-and-deprecations.md
