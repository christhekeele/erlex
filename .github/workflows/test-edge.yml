name: Test ❯ Edge
# Runs tests against edge versions of Erlang/OTP and Elixir
# to get ahead of incompatible changes.

on:
  # Allow running from GitHub UI.
  workflow_dispatch: {}

  # Run daily.
  schedule:
    - cron: 0 0 * * *

env:
  MIX_ENV: test

concurrency:
  group: test-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testing Edge
    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.type == 'optional' }}
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - "ubuntu-22.04"
          # - "ubuntu-20.04" # Retired
          - "windows-2025"
          - "windows-2022"
          - "macOS-15"
          - "macOS-14"
          # - "macOS-13" # Retired
        elixir:
          - ${{ vars.PREFERRED_ELIXIR }}
          - ${{ vars.EDGE_ELIXIR }}
        otp:
          - ${{ vars.PREFERRED_OTP }}
          - ${{ vars.EDGE_OTP }}
        type: [optional]

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        id: beam-versions
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-rebar: ${{ runner.os != 'Windows' }}

      - name: Unlock dependencies
        run: mix deps.unlock --all

      - name: Install mix dependencies
        run: mix deps.get

      - name: Compile mix dependencies
        run: mix deps.compile

      - name: Run test suite
        run: mix test

  types:
    name: Typechecking Edge
    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.type == 'optional' }}
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - "ubuntu-22.04"
          # - "ubuntu-20.04" # Retired
          - "windows-2025"
          - "windows-2022"
          - "macOS-15"
          - "macOS-14"
          # - "macOS-13" # Retired
        elixir:
          - ${{ vars.PREFERRED_ELIXIR }}
          - ${{ vars.EDGE_ELIXIR }}
        otp:
          - ${{ vars.PREFERRED_OTP }}
          - ${{ vars.EDGE_OTP }}
        type: [optional]

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        id: beam-versions
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-rebar: ${{ runner.os != 'Windows' }}

      - name: Unlock dependencies
        run: mix deps.unlock --all

      - name: Install mix dependencies
        run: mix deps.get

      - name: Compile mix dependencies
        run: mix deps.compile

      - name: Run typecheck tasks
        run: mix typecheck

  lints:
    name: Linting Edge
    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.type == 'optional' }}
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - "ubuntu-22.04"
          # - "ubuntu-20.04" # Retired
          - "windows-2025"
          - "windows-2022"
          - "macOS-15"
          - "macOS-14"
          # - "macOS-13" # Retired
        elixir:
          - ${{ vars.PREFERRED_ELIXIR }}
          - ${{ vars.EDGE_ELIXIR }}
        otp:
          - ${{ vars.PREFERRED_OTP }}
          - ${{ vars.EDGE_OTP }}
        type: [optional]

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        id: beam-versions
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-rebar: ${{ runner.os != 'Windows' }}

      - name: Unlock dependencies
        run: mix deps.unlock --all

      - name: Install mix dependencies
        run: mix deps.get

      - name: Compile mix dependencies
        run: mix deps.compile

      - name: Run linter tasks
        run: mix lint
        continue-on-error: true

  results:
    name: Test Edge Action Results
    runs-on: ${{ vars.PREFERRED_OS }}

    if: ${{ always() }}
    needs:
      - tests
      - types
      - lints

    steps:
      - name: Test Suite Succeeded
        if: ${{ needs.tests.result == 'success' && needs.types.result == 'success' && needs.lints.result == 'success' }}
        run: exit 0

      - name: Test Suite Failed
        if: ${{ needs.tests.result == 'failure' || needs.types.result == 'failure' || needs.lints.result == 'failure' }}
        run: exit 1
